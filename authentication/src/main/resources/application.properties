spring.application.name=authentication-service
spring.config.import=optional:configserver:http://localhost:8888
server.port=8080

# Local database connection (fallback if Config Server is not available)
spring.datasource.url=jdbc:mysql://localhost:3306/stu_jwt
spring.datasource.username=root
spring.datasource.password=Varun@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT Configuration (fallback if Config Server is not available)
app.jwt.secret=daf66e01593f61a15b857cf433aae03a005812b31234e149036bcc8dee755dbb
app.jwt.expiration-milliseconds=86400000
app.jwt.refresh-expiration-milliseconds=604800000
app.jwt.token-prefix=Bearer
app.jwt.token-header=Authorization

# Role Configuration
app.roles.admin=ADMIN
app.roles.user=USER
app.roles.student=STUDENT
app.roles.librarian=LIBRARIAN

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Management endpoints
management.endpoints.web.exposure.include=health,info,refresh