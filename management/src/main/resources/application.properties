spring.application.name=management-service
spring.config.import=optional:configserver:http://localhost:8888
server.port=8081

# Database Configuration (fallback if Config Server is not available)
spring.datasource.url=jdbc:mysql://localhost:3306/student_management
spring.datasource.username=root
spring.datasource.password=Varun@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.initialization-mode=always

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration (fallback if Config Server is not available)
app.jwt.secret=daf66e01593f61a15b857cf433aae03a005812b31234e149036bcc8dee755dbb
app.jwt.expiration-milliseconds=86400000

# Role Configuration
app.roles.student=STUDENT
app.roles.admin=ADMIN

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
# Library Service Configuration
library.service.base-url=http://localhost:8082
library.service.register-student-endpoint=/api/library/students