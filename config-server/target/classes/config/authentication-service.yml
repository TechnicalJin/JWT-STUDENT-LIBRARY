# Authentication Service Configuration
server:
  port: 8080

spring:
  application:
    name: authentication-service
  datasource:
    url: jdbc:mysql://localhost:3306/stu_jwt
    username: ${database.mysql.username}
    password: ${database.mysql.password}
    driver-class-name: ${database.mysql.driver-class-name}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

# JWT Configuration (inherited from common config but can be overridden)
app:
  jwt:
    secret: ${app.jwt.secret}
    expiration-milliseconds: ${app.jwt.expiration-milliseconds}
    refresh-expiration-milliseconds: ${app.jwt.refresh-expiration-milliseconds}
    token-prefix: ${app.jwt.token-prefix}
    token-header: ${app.jwt.token-header}

# Service-specific logging
logging:
  level:
    com.jwt.authentication.service: DEBUG